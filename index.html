<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Co-Climate — Making environmental restoration measurable, verifiable, and visible. Where nature meets data, claims become proof." />
    <meta name="theme-color" content="#050505" />
    <meta property="og:title" content="Co-Climate — Make Impact Visible" />
    <meta property="og:description" content="Turning real-world environmental activity into meaningful evidence and measurable impact." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Co-Climate — Make Impact Visible" />
    <meta name="twitter:description" content="The planet doesn't need promises. It needs proof." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Co-Climate — Make Impact Visible</title>
    <script>
      (function() {
        const storedTheme = localStorage.getItem('coclimate-theme');
        if (storedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
